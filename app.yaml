# Databricks App entry point. Deploy from the repo root so both backend/api
# and backend/LLM are included. Databricks gives the port in
# DATABRICKS_APP_PORT; the command is not run through a shell, so read it in
# Python rather than with $VAR.
command:
  - "python"
  - "-c"
  - "import os, uvicorn; uvicorn.run('backend.api.main:app', host='0.0.0.0', port=int(os.environ.get('DATABRICKS_APP_PORT', 8000)))"
env:
  - name: MODEL_ENDPOINT
    value: "databricks-gpt-oss-120b"
